# Runs in the STORE OWNER's repo: daily encrypted backup of the Supabase database.
# The dump is encrypted with BACKUP_PASSPHRASE (AES-256, gpg) and kept as a private
# workflow artifact for BACKUP_RETENTION_DAYS days (Actions → this workflow → a run → Artifacts).
#
# Needs these repository secrets (Settings → Secrets and variables → Actions) — the first
# three are the same as the "Database migrations" workflow:
#   SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — the project id in the dashboard URL
#   SUPABASE_DB_PASSWORD   — database password
#   BACKUP_PASSPHRASE      — a long random passphrase; WITHOUT IT THE BACKUPS CANNOT BE OPENED
# Without the secrets (e.g. in the coder's repo) the job skips with a notice.
# Restore: see docs/BACKUPS.md

name: Database backup

on:
  schedule:
    - cron: '17 2 * * *' # every day 02:17 UTC
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  BACKUP_RETENTION_DAYS: 30

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::Backup secrets not configured — skipping (see docs/BACKUPS.md)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.run == 'true'

      - uses: supabase/setup-cli@v3
        if: steps.check.outputs.run == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.check.outputs.run == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Dump database
        if: steps.check.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p backup
          # store schema (tables, functions, RLS) + all store data + admin logins
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" -f backup/schema.sql
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --data-only --use-copy -f backup/data.sql
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --data-only --use-copy --schema auth -f backup/auth.sql
          for f in backup/*.sql; do
            if [ ! -s "$f" ]; then echo "::error::$f is empty"; exit 1; fi
          done
          ls -la backup

      - name: Encrypt
        if: steps.check.outputs.run == 'true'
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          tar -czf "plus-store-x-db-$STAMP.tar.gz" -C backup .
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "plus-store-x-db-$STAMP.tar.gz.gpg" "plus-store-x-db-$STAMP.tar.gz"
          rm -rf backup "plus-store-x-db-$STAMP.tar.gz"
          ls -la *.gpg

      - uses: actions/upload-artifact@v7
        if: steps.check.outputs.run == 'true'
        with:
          name: db-backup-${{ env.STAMP }}
          path: plus-store-x-db-*.tar.gz.gpg
          retention-days: ${{ env.BACKUP_RETENTION_DAYS }}
          if-no-files-found: error
