# Runs in the STORE OWNER's repo: applies new database migrations to their Supabase project.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — the project id in the dashboard URL (abcdefghijklmnop)
#   SUPABASE_DB_PASSWORD   — database password chosen when the project was created
# Without the secrets (e.g. in the coder's repo) the job skips with a notice.
# Actions are pinned to commit SHAs and the CLI to an exact version; secrets are only
# given to the step that uses them.

name: Database migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.121.0

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_REF: ${{ secrets.SUPABASE_PROJECT_REF != '' }}
          HAS_DB: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_REF" != "true" ] || [ "$HAS_DB" != "true" ]; then
            echo "::notice::Supabase secrets not configured — skipping migrations."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.check.outputs.run == 'true'
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.check.outputs.run == 'true'
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Link project and push migrations
        if: steps.check.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
