# Runs in the STORE OWNER's repo: applies new database migrations to their Supabase project.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — the project id in the dashboard URL (abcdefghijklmnop)
#   SUPABASE_DB_PASSWORD   — database password chosen when the project was created
# Without the secrets (e.g. in the coder's repo) the job skips with a notice.

name: Database migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase secrets not configured — skipping migrations."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.run == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.run == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.check.outputs.run == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        if: steps.check.outputs.run == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
