# Local development only (`npm run db:start` → `supabase start`, needs Docker).
# The hosted Supabase project of each store owner is configured in its dashboard.
project_id = "plus-store-x"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# demo data for local testing — never pushed to production by `supabase db push`
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[realtime]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

# public images uploaded from the admin panel (logo, product images, landing hero)
[storage.buckets.public-assets]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "image/gif", "image/svg+xml"]

[auth]
enabled = true
# the admin panel is served by the worker (`npm run dev`) or by Vite (`npm run dev:admin`)
site_url = "http://127.0.0.1:8787/admin/"
additional_redirect_urls = ["http://localhost:8787/admin/", "http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Admin accounts are created by the owner (Studio → Authentication → Add user, or the panel's
# "Admins" page). Public sign-ups stay disabled.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
